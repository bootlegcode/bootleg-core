name: Core contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy && rustup default 1.99.1
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets && cargo test --locked --doc
      - name: Regeneration must leave tracked and untracked contracts unchanged
        run: |
          cargo run --locked --example export-schemas
          cargo run --locked --example export-fixtures
          test -z "$(git status --porcelain -- schemas fixtures)"
